<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17111f"><link rel="manifest" href="manifest.webmanifest"><title>Oracle des runes nordiques</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#35213f,#17111f 55%,#0d0b12);color:#f8f0dc;font-family:Georgia,serif}.wrap{max-width:900px;margin:auto;padding:22px 16px 50px}.panel{background:#21182b;border:1px solid #8b704866;border-radius:16px;padding:18px;margin:14px 0}.gold{color:#f2dfaa}button,select,input,textarea{font:inherit;border-radius:9px;padding:11px;border:1px solid #8b7048;background:#17111f;color:#fff;max-width:100%}button{background:#d7b76b;color:#17111f;font-weight:bold;cursor:pointer;margin:5px}textarea{width:100%;min-height:85px}a{color:#f2dfaa}.muted{color:#c2b5ca;font:14px/1.6 Arial}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.card{background:#30233b;border:1px solid #a88b5c;border-radius:12px;padding:13px;text-align:center;min-height:105px}.out{white-space:pre-wrap;line-height:1.7;font:15px/1.7 Arial;color:#f7edda}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.status{color:#d7b76b;font:13px Arial}.home{display:inline-block;margin-bottom:15px}</style></head><body><main class="wrap"><a class="home" href="index.html">← Retour aux six oracles</a><h1 class="gold">Oracle des runes nordiques</h1><p class="muted">Les 24 runes de l’Elder Futhark. Tirage symbolique à visée réflexive, pas une prédiction certaine.</p><section class="panel"><label>Ta question</label><textarea id="question" placeholder="Dicte ou écris ta question…"></textarea><button id="mic">🎙️ Dicter</button><span id="voiceStatus" class="status"></span><p><label>Nombre de symboles</label> <select id="count"><option>1</option><option selected>3</option><option>5</option><option>7</option></select></p><button id="draw"> V1';let pulled=[],controller=null;const $=id=>document.getElementById(id);function pick(){pulled=[];let pool=[...DECK];for(let i=0;i<Math.min(+$('count').value,pool.length);i++){let n=Math.floor(Math.random()*pool.length);pulled.push(pool.splice(n,1)[0]);}$('drawn').innerHTML='';pulled.forEach((c,i)=>{let d=document.createElement('div');d.className='card';d.innerHTML='<div style="font-size:28px;color:#d7b76b">'+(c.symbol||'✧')+'</div><b>'+c.name+'</b><p class="muted">'+c.meaning+'</p><small>'+(i===0?'Situation':i===1?'Évolution':'Conseil')+'</small>'; $('drawn').append(d);});save('Tirage effectué');}function history(){let a=[];try{a=JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){}$('history').innerHTML='';a.filter(x=>x.game===document.title).slice(0,8).forEach(x=>{let d=document.createElement('details');let s=document.createElement('summary');s.textContent=(x.date||'')+' — '+(x.question||'Tirage général');let p=document.createElement('p');p.textContent=(x.cards||'')+'\n'+(x.interpretation||'');d.append(s,p);$('history').append(d);});}function save(interpretation){if(!pulled.length)return;let a=[];try{a=JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){}let q=$('question').value.trim()||'Tirage général';let sig=document.title+'|'+q+'|'+pulled.map(x=>x.name).join(',');let item=a.find(x=>x.signature===sig);if(!item){item={id:Date.now(),signature:sig,game:document.title,date:new Date().toLocaleString('fr-FR'),question:q,summary:'',cards:pulled.map((x,i)=>(i+1)+'. '+x.name+' — '+x.meaning).join('\n'),interpretation:''};a.unshift(item)}if(interpretation&&interpretation!=='Tirage effectué')item.interpretation=interpretation;localStorage.setItem(STORE,JSON.stringify(a.slice(0,150)));history();}$('draw').onclick=pick;$('analyze').onclick=async()=>{if(!pulled.length)pick();let key=localStorage.getItem(KEY)||'';if(!key){$('status').textContent='Ajoute d’abord ta clé Gemini sur la page d’accueil.';return;}controller=new AbortController();$('status').textContent='Analyse en cours…';$('output').textContent='';let prompt=`Tu es un interprète expert de Oracle des runes nordiques. Analyse en français, avec nuance et profondeur. Réponds à la question sans présenter le symbolisme comme une certitude. Explique chaque symbole dans sa position, les liens entre eux, les tensions, les scénarios possibles, les conseils concrets et une synthèse. Question : ${$('question').value||'Tirage général'}. Tirage : ${JSON.stringify(pulled)}`;try{let r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.75,maxOutputTokens:8192}}),signal:controller.signal});let j=await r.json();if(!r.ok)throw Error(j.error?.message||'Erreur Gemini');let t=j.candidates?.[0]?.content?.parts?.map(x=>x.text||'').join('\n')||'Réponse vide';$('output').textContent=t;save(t);$('status').textContent='Interprétation enregistrée dans l’historique.'}catch(e){$('status').textContent=e.name==='AbortError'?'Analyse interrompue.':e.message}};$('cancel').onclick=()=>controller?.abort();$('speak').onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('output').textContent);u.lang='fr-FR';speakOracleText(u.text)};$('pause').onclick=()=>speechSynthesis.paused?speechSynthesis.resume():speechSynthesis.pause();$('stop').onclick=()=>speechSynthesis.cancel();const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(R)$('mic').onclick=()=>{let r=new R();r.lang='fr-FR';r.onresult=e=>$('question').value=e.results[0][0].transcript;r.start();$('voiceStatus').textContent='Je t’écoute…'};else $('mic').disabled=true;history();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script><script>
(()=>{
 const page=location.pathname.split('/').pop()||'oracle';

 ];

 let selected=choices[page]||'gemini-3.8-flash';
 const box=document.createElement('section');box.id='oracleGeminiModelPanel';box.style.cssText='margin:12px 0;padding:12px;border:1px solid #b99a62;border-radius:12px;background:rgba(25,20,34,.94);color:#f7efd9;font:14px system-ui';
 const title=document.createElement('label');title.textContent='⚙ Modèle Gemini pour cet oracle';title.style.cssText='display:block;font-weight:700;margin-bottom:7px';
 const select=document.createElement('select');select.id='oracleGeminiModelChoice';select.style.cssText='width:100%;padding:10px;border-radius:8px;background:#17283b;color:#fff;border:1px solid #8b7048';

 const fill=(arr)=>{select.innerHTML='';arr.forEach(([id,label])=>{let o=document.createElement('option');o.value=id;o.textContent=label;select.append(o)});if(!arr.some(x=>x[0]===selected))selected=arr[0]?.[0]||'gemini-3.8-flash';select.value=selected;};fill(catalog);
 select.addEventListener('change',()=>{selected=select.value;choices[page]=selected;localStorage.setItem(store,JSON.stringify(choices));status.textContent='Modèle choisi : '+selected+'. Il sera utilisé pour les prochaines analyses de cet oracle.';});
 refresh.addEventListener('click',async()=>{const key=getKey();if(!key){status.textContent='Enregistre d’abord ta clé Gemini sur la page d’accueil.';return;}refresh.disabled=true;status.textContent='Récupération des modèles accessibles à ta clé…';try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?key='+encodeURIComponent(key));const d=await r.json();if(!r.ok)throw Error(d.error?.message||('HTTP '+r.status));const found=(d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>{const id=(m.name||'').replace(/^models\//,'');return [id,(m.displayName||id)+(m.description?' — '+m.description.slice(0,65):'')]}).filter(x=>/^gemini-/.test(x[0]));if(!found.length)throw Error('Google n’a renvoyé aucun modèle compatible generateContent.');const unique=[...new Map(found.map(x=>[x[0],x])).values()].sort((a,b)=>a[0].localeCompare(b[0]));fill(unique);status.textContent=unique.length+' modèles Gemini compatibles trouvés pour cette clé. Le choix reste propre à cet oracle.';}catch(e){status.textContent='Impossible d’actualiser : '+e.message+' — la liste intégrée reste disponible.';}finally{refresh.disabled=false;}});

 const target=document.querySelector('main')||document.querySelector('.container')||document.body;

 // Android Chrome can stall on long speech utterances: split at sentence boundaries.
 window.speakOracleText=(text)=>{if(!('speechSynthesis'in window)){alert('La lecture vocale n’est pas disponible dans ce navigateur.');return;}const synth=window.speechSynthesis;synth.cancel();const clean=String(text||'').replace(/```[\s\S]*?```/g,' ').replace(/[#*_`]/g,' ').replace(/\s+/g,' ').trim();if(!clean)return;const chunks=[];let rest=clean;while(rest.length>0){if(rest.length<=180){chunks.push(rest);break;}let cut=Math.max(rest.lastIndexOf('. ',180),rest.lastIndexOf('! ',180),rest.lastIndexOf('? ',180),rest.lastIndexOf('; ',180),rest.lastIndexOf(', ',180),rest.lastIndexOf(' ',180));if(cut<70)cut=180;chunks.push(rest.slice(0,cut+1).trim());rest=rest.slice(cut+1).trim();}let i=0;const next=()=>{if(i>=chunks.length)return;const u=new SpeechSynthesisUtterance(chunks[i++]);u.lang='fr-FR';u.rate=.94;u.onend=()=>{if(i<chunks.length)next()};u.onerror=(e)=>{if(e.error!=='canceled'&&i<chunks.length)setTimeout(next,150)};synth.speak(u)};setTimeout(next,120);};
