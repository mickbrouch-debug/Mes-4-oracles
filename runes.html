<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17111f"><link rel="manifest" href="manifest.webmanifest"><title>Oracle des runes nordiques</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#35213f,#17111f 55%,#0d0b12);color:#f8f0dc;font-family:Georgia,serif}.wrap{max-width:900px;margin:auto;padding:22px 16px 50px}.panel{background:#21182b;border:1px solid #8b704866;border-radius:16px;padding:18px;margin:14px 0}.gold{color:#f2dfaa}button,select,input,textarea{font:inherit;border-radius:9px;padding:11px;border:1px solid #8b7048;background:#17111f;color:#fff;max-width:100%}button{background:#d7b76b;color:#17111f;font-weight:bold;cursor:pointer;margin:5px}textarea{width:100%;min-height:85px}a{color:#f2dfaa}.muted{color:#c2b5ca;font:14px/1.6 Arial}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.card{background:#30233b;border:1px solid #a88b5c;border-radius:12px;padding:13px;text-align:center;min-height:105px}.out{white-space:pre-wrap;line-height:1.7;font:15px/1.7 Arial;color:#f7edda}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.status{color:#d7b76b;font:13px Arial}.home{display:inline-block;margin-bottom:15px}</style></head><body><main class="wrap"><a class="home" href="index.html">← Retour aux six oracles</a><h1 class="gold">Oracle des runes nordiques</h1><p class="muted">Les 24 runes de l’Elder Futhark. Tirage symbolique à visée réflexive, pas une prédiction certaine.</p><section class="panel"><label>Ta question</label><textarea id="question" placeholder="Dicte ou écris ta question…"></textarea><button id="mic">🎙️ Dicter</button><span id="voiceStatus" class="status"></span><p><label>Nombre de symboles</label> <select id="count"><option>1</option><option selected>3</option><option>5</option><option>7</option></select></p><button id="draw">Effectuer le tirage</button><div id="drawn" class="cards"></div></section><section class="panel"><h2 class="gold">Interprétation Gemini</h2><button id="analyze">Analyser le tirage</button><button id="cancel">Interrompre</button><div id="status" class="status"></div><div id="output" class="out"></div><div class="row"><button id="speak">🔊 Lire</button><button id="pause">Pause / Reprise</button><button id="stop">Arrêter la voix</button></div></section><section class="panel"><h2 class="gold">Historique partagé</h2><div id="history" class="muted"></div></section></main><script>
const DECK=[{"symbol": "ᚠ", "name": "Fehu", "meaning": "ressources, circulation, prospérité"}, {"symbol": "ᚢ", "name": "Uruz", "meaning": "force vitale, endurance, santé"}, {"symbol": "ᚦ", "name": "Thurisaz", "meaning": "défense, seuil, prudence"}, {"symbol": "ᚨ", "name": "Ansuz", "meaning": "parole, inspiration, transmission"}, {"symbol": "ᚱ", "name": "Raidho", "meaning": "voyage, mouvement, juste direction"}, {"symbol": "ᚲ", "name": "Kenaz", "meaning": "clarté, savoir-faire, révélation"}, {"symbol": "ᚷ", "name": "Gebo", "meaning": "don, échange, réciprocité"}, {"symbol": "ᚹ", "name": "Wunjo", "meaning": "joie, harmonie, appartenance"}, {"symbol": "ᚺ", "name": "Hagalaz", "meaning": "rupture, imprévu, réorganisation"}, {"symbol": "ᚾ", "name": "Nauthiz", "meaning": "nécessité, contrainte, patience"}, {"symbol": "ᛁ", "name": "Isa", "meaning": "pause, immobilité, concentration"}, {"symbol": "ᛃ", "name": "Jera", "meaning": "cycle, récolte, maturation"}, {"symbol": "ᛇ", "name": "Eihwaz", "meaning": "résilience, passage, transformation"}, {"symbol": "ᛈ", "name": "Perthro", "meaning": "mystère, hasard, potentiel caché"}, {"symbol": "ᛉ", "name": "Algiz", "meaning": "protection, vigilance, limites"}, {"symbol": "ᛊ", "name": "Sowilo", "meaning": "succès, énergie, lucidité"}, {"symbol": "ᛏ", "name": "Tiwaz", "meaning": "justice, courage, engagement"}, {"symbol": "ᛒ", "name": "Berkano", "meaning": "naissance, soin, croissance"}, {"symbol": "ᛖ", "name": "Ehwaz", "meaning": "coopération, confiance, progression"}, {"symbol": "ᛗ", "name": "Mannaz", "meaning": "identité, communauté, conscience de soi"}, {"symbol": "ᛚ", "name": "Laguz", "meaning": "intuition, fluidité, émotions"}, {"symbol": "ᛜ", "name": "Ingwaz", "meaning": "gestation, accomplissement, potentiel"}, {"symbol": "ᛞ", "name": "Dagaz", "meaning": "éveil, bascule, nouveau jour"}, {"symbol": "ᛟ", "name": "Othala", "meaning": "héritage, foyer, transmission"}];const STORE='oraclesSuiteHistoryV2',KEY='oraclesSuiteGeminiApiKeyV1';let pulled=[],controller=null;const $=id=>document.getElementById(id);function pick(){pulled=[];let pool=[...DECK];for(let i=0;i<Math.min(+$('count').value,pool.length);i++){let n=Math.floor(Math.random()*pool.length);pulled.push(pool.splice(n,1)[0]);}$('drawn').innerHTML='';pulled.forEach((c,i)=>{let d=document.createElement('div');d.className='card';d.innerHTML='<div style="font-size:28px;color:#d7b76b">'+(c.symbol||'✧')+'</div><b>'+c.name+'</b><p class="muted">'+c.meaning+'</p><small>'+(i===0?'Situation':i===1?'Évolution':'Conseil')+'</small>'; $('drawn').append(d);});save('Tirage effectué');}function history(){let a=[];try{a=JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){}$('history').innerHTML='';a.filter(x=>x.game===document.title).slice(0,8).forEach(x=>{let d=document.createElement('details');let s=document.createElement('summary');s.textContent=(x.date||'')+' — '+(x.question||'Tirage général');let p=document.createElement('p');p.textContent=(x.cards||'')+'\n'+(x.interpretation||'');d.append(s,p);$('history').append(d);});}function save(interpretation){if(!pulled.length)return;let a=[];try{a=JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){}let q=$('question').value.trim()||'Tirage général';let sig=document.title+'|'+q+'|'+pulled.map(x=>x.name).join(',');let item=a.find(x=>x.signature===sig);if(!item){item={id:Date.now(),signature:sig,game:document.title,date:new Date().toLocaleString('fr-FR'),question:q,summary:'',cards:pulled.map((x,i)=>(i+1)+'. '+x.name+' — '+x.meaning).join('\n'),interpretation:''};a.unshift(item)}if(interpretation&&interpretation!=='Tirage effectué')item.interpretation=interpretation;localStorage.setItem(STORE,JSON.stringify(a.slice(0,150)));history();}$('draw').onclick=pick;$('analyze').onclick=async()=>{if(!pulled.length)pick();let key=localStorage.getItem(KEY)||'';if(!key){$('status').textContent='Ajoute d’abord ta clé Gemini sur la page d’accueil.';return;}controller=new AbortController();$('status').textContent='Analyse en cours…';$('output').textContent='';let prompt=`Tu es un interprète expert de Oracle des runes nordiques. Analyse en français, avec nuance et profondeur. Réponds à la question sans présenter le symbolisme comme une certitude. Explique chaque symbole dans sa position, les liens entre eux, les tensions, les scénarios possibles, les conseils concrets et une synthèse. Question : ${$('question').value||'Tirage général'}. Tirage : ${JSON.stringify(pulled)}`;try{let r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.75,maxOutputTokens:8192}}),signal:controller.signal});let j=await r.json();if(!r.ok)throw Error(j.error?.message||'Erreur Gemini');let t=j.candidates?.[0]?.content?.parts?.map(x=>x.text||'').join('\n')||'Réponse vide';$('output').textContent=t;save(t);$('status').textContent='Interprétation enregistrée dans l’historique.'}catch(e){$('status').textContent=e.name==='AbortError'?'Analyse interrompue.':e.message}};$('cancel').onclick=()=>controller?.abort();$('speak').onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('output').textContent);u.lang='fr-FR';speakOracleText(u.text)};$('pause').onclick=()=>speechSynthesis.paused?speechSynthesis.resume():speechSynthesis.pause();$('stop').onclick=()=>speechSynthesis.cancel();const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(R)$('mic').onclick=()=>{let r=new R();r.lang='fr-FR';r.onresult=e=>$('question').value=e.results[0][0].transcript;r.start();$('voiceStatus').textContent='Je t’écoute…'};else $('mic').disabled=true;history();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>

<script>
(()=> {
 'use strict';
 const file=(location.pathname.split('/').pop()||'index.html').toLowerCase();
 const pageKey=({ 'tarot-78.html':'tarot','lenormand-54.html':'lenormand','belline.html':'belline','portes-intuition.html':'portes','astrologie.html':'astrologie','runes.html':'runes','analyse-croisee.html':'analyse-croisee' })[file]||file;
 const KEY='oraclesGeminiModelByOracleV1';
 const KEY_API='oraclesSuiteGeminiApiKeyV1';
 const getKey=()=>{try{return localStorage.getItem(KEY_API)||localStorage.getItem('geminiApiKey')||''}catch(e){return ''}};
 let choices={};try{choices=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
 let selected=choices[pageKey]||'gemini-2.5-flash';
 const legacy=document.getElementById('aiModel');
 let panel=document.createElement('section');
 panel.id='geminiModelSelectorFixed';
 panel.style.cssText='margin:14px 0;padding:14px;border:1px solid #b99a62;border-radius:12px;background:#171827;color:#f8f2e6;font:14px system-ui;position:relative;z-index:5';
 const label=document.createElement('label');label.textContent='Modèle Gemini utilisé pour cet oracle';label.style.cssText='display:block;font-weight:700;margin-bottom:8px';
 let select=legacy||document.createElement('select');
 if(!legacy) select.id='geminiModelSelectorFixedSelect';
 select.style.cssText='display:block;width:100%;min-height:44px;padding:9px;border-radius:8px;background:#fff;color:#171827;border:1px solid #9a855d;font:16px system-ui';
 const status=document.createElement('p');status.style.cssText='margin:8px 0 0;font-size:12px;line-height:1.4';status.textContent='Modèle mémorisé pour cet oracle. Actualise la liste pour afficher les modèles réellement proposés par Google avec ta clé.';
 const actions=document.createElement('div');actions.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin-top:9px';
 const refresh=document.createElement('button');refresh.type='button';refresh.textContent='Actualiser les modèles Google';
 refresh.style.cssText='padding:9px 12px;border-radius:8px;border:1px solid #b99a62;background:#30283a;color:#fff';
 const test=document.createElement('button');test.type='button';test.textContent='Tester ce modèle';
 test.style.cssText=refresh.style.cssText;
 if(!legacy){panel.append(label,select); } else { panel.append(label,select); }
 actions.append(refresh,test);panel.append(actions,status);
 // Place the selector at the start of the page, not buried inside a hidden modal.
 const target=document.querySelector('main')||document.querySelector('.container')||document.body;
 target.insertBefore(panel,target.firstChild);
 const saveChoice=()=>{selected=select.value;choices[pageKey]=selected;try{localStorage.setItem(KEY,JSON.stringify(choices))}catch(e){}status.textContent='Choix enregistré pour '+pageKey+' : '+selected+'. Les prochaines interprétations utiliseront ce modèle.'};
 // Keep a stable selection even if the current page's old select had only one hard-coded option.
 if(![...select.options].some(o=>o.value===selected)){let o=document.createElement('option');o.value=selected;o.textContent=selected+' (sélection mémorisée)';select.append(o)}
 select.value=selected;select.addEventListener('change',saveChoice);
 async function refreshModels(){
   const key=getKey();if(!key){status.textContent='Clé API absente. Enregistre la clé commune sur la page d’accueil, puis réessaie.';return}
   refresh.disabled=true;status.textContent='Interrogation de Google pour obtenir les modèles compatibles…';
   try{
     const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000',{headers:{'x-goog-api-key':key}});
     const d=await r.json();if(!r.ok)throw new Error(d.error?.message||('HTTP '+r.status));
     const models=(d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')&&/^models\/gemini-/i.test(m.name||'')&&!/(embedding|image|tts|live|audio|video|transcrib)/i.test((m.name||'')+' '+(m.displayName||'')));
     if(!models.length)throw new Error('Google ne renvoie aucun modèle compatible generateContent pour cette clé.');
     const items=models.map(m=>({id:(m.name||'').replace(/^models\//,''),label:(m.displayName||m.name)+' — '+(m.name||'').replace(/^models\//,'')})).sort((a,b)=>a.id.localeCompare(b.id));
     const old=selected;select.replaceChildren();
     for(const m of items){const o=document.createElement('option');o.value=m.id;o.textContent=m.label;select.append(o)}
     if(items.some(m=>m.id===old))select.value=old;else {select.value=items.some(m=>m.id==='gemini-2.5-flash')?'gemini-2.5-flash':items[0].id}
     saveChoice();status.textContent=items.length+' modèles réellement proposés par Google et compatibles avec generateContent. Le modèle sélectionné est enregistré uniquement pour cet oracle.';
   }catch(e){status.textContent='Échec de récupération : '+e.message+'. Vérifie la clé, la connexion et les droits de l’API Gemini.'}
   finally{refresh.disabled=false}
 }
 async function testModel(){
   const key=getKey();if(!key){status.textContent='Clé API absente : enregistre-la sur la page d’accueil.';return}
   saveChoice();test.disabled=true;status.textContent='Test du modèle '+selected+'…';
   try{
     const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(selected)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{parts:[{text:'Réponds uniquement par OK.'}]}],generationConfig:{maxOutputTokens:16,temperature:0}})});
     const d=await r.json();if(!r.ok)throw new Error(d.error?.message||('HTTP '+r.status));
     status.textContent='Test réussi : '+selected+' répond correctement.';
   }catch(e){status.textContent='Test échoué pour '+selected+' : '+e.message}
   finally{test.disabled=false}
 }
 refresh.addEventListener('click',refreshModels);test.addEventListener('click',testModel);
 // Critical: every oracle previously called a hard-coded model. Rewrite ONLY the
 // generateContent endpoint at request time using the per-oracle saved selection.
 const nativeFetch=window.fetch.bind(window);
 window.fetch=function(input,init){
   let raw=typeof input==='string'?input:(input&&input.url)||'';
   if(raw.includes('generativelanguage.googleapis.com')&&raw.includes(':generateContent')){
     let current=selected;try{const c=JSON.parse(localStorage.getItem(KEY)||'{}');current=c[pageKey]||selected}catch(e){}
     const u=new URL(raw,location.href);
     u.pathname=u.pathname.replace(/\/models\/[^/]+:generateContent/, '/models/'+encodeURIComponent(current)+':generateContent');
     if(typeof input==='string') input=u.toString();
     else input=new Request(u.toString(),input);
   }
   return nativeFetch(input,init);
 };
 // If API key already exists, populate the list automatically once on page load.
 if(getKey()) refreshModels();
})();
</script>
