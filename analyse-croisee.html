<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analyse croisée IA</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#35213f,#17111f 55%,#0d0b12);color:#f8f0dc;font-family:Georgia,serif}.wrap{max-width:900px;margin:auto;padding:22px 16px 50px}.panel{background:#21182b;border:1px solid #8b704866;border-radius:16px;padding:18px;margin:14px 0}.gold{color:#f2dfaa}button,select,input,textarea{font:inherit;border-radius:9px;padding:11px;border:1px solid #8b7048;background:#17111f;color:#fff;max-width:100%}button{background:#d7b76b;color:#17111f;font-weight:bold;cursor:pointer;margin:5px}textarea{width:100%;min-height:85px}a{color:#f2dfaa}.muted{color:#c2b5ca;font:14px/1.6 Arial}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.card{background:#30233b;border:1px solid #a88b5c;border-radius:12px;padding:13px;text-align:center;min-height:105px}.out{white-space:pre-wrap;line-height:1.7;font:15px/1.7 Arial;color:#f7edda}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.status{color:#d7b76b;font:13px Arial}.home{display:inline-block;margin-bottom:15px}</style></head><body><main class="wrap"><a class="home" href="index.html">← Retour aux six oracles</a><h1 class="gold">Analyse croisée des systèmes</h1><p class="muted">Sélectionne des tirages enregistrés dans l’historique commun. Gemini recherchera convergences, nuances et contradictions sans confondre les traditions.</p><section class="panel"><label>Question centrale (facultatif)</label><textarea id="question" placeholder="Quelle question veux-tu éclairer à travers plusieurs systèmes ?"></textarea><div id="entries"></div><div class="row"><button id="refresh">Actualiser l’historique</button><button id="run">Lancer l’analyse croisée</button><button id="cancel">Interrompre</button></div><div id="status" class="status"></div></section><section class="panel"><h2 class="gold">Synthèse comparative IA</h2><div id="output" class="out"></div><div class="row"><button id="speak">🔊 Lire</button><button id="pause">Pause / Reprise</button><button id="stop">Arrêter</button></div></section></main><script>const STORE='oraclesSuiteHistoryV2',KEY='oraclesSuiteGeminiApiKeyV1';const $=id=>document.getElementById(id);let selected=[],controller=null;function load(){let a=[];try{a=JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){}$('entries').innerHTML='';if(!a.length){$('entries').textContent='Aucun tirage trouvé. Effectue d’abord des tirages dans les oracles puis reviens ici.';return}a.forEach((x,i)=>{let l=document.createElement('label');l.style.cssText='display:block;padding:10px;border-bottom:1px solid #55435f;font:14px Arial';let c=document.createElement('input');c.type='checkbox';c.value=i;c.style.marginRight='9px';c.onchange=()=>{selected=c.checked?[...selected,i]:selected.filter(n=>n!==i)};l.append(c,document.createTextNode((x.game||'Oracle')+' · '+(x.date||'')+' · '+(x.question||'Tirage général')+' · '+(x.interpretation?'IA disponible':'sans interprétation IA')));$('entries').append(l)});window.__crossHistory=a}async function run(){let a=window.__crossHistory||[];let chosen=selected.map(i=>a[i]).filter(Boolean);if(chosen.length<2){$('status').textContent='Sélectionne au moins deux tirages de systèmes différents.';return}let systems=[...new Set(chosen.map(x=>x.game))];if(systems.length<2){$('status').textContent='Choisis au moins deux systèmes différents.';return}let key=localStorage.getItem(KEY)||'';if(!key){$('status').textContent='Ajoute ta clé Gemini sur la page d’accueil.';return}let prompt=`Tu es un analyste comparatif des traditions symboliques. Analyse ces tirages provenant de systèmes différents. Respecte la logique propre de chaque système, ne fusionne pas leurs significations et n’invente aucune donnée. Distingue convergences réelles, complémentarités, contradictions, éléments absents et hypothèses. Ne transforme pas une lecture symbolique en prédiction certaine. Structure : contexte commun; lecture de chaque système séparément; convergences; divergences/contradictions; ce que chaque système apporte de spécifique; synthèse intégrée; conseils concrets et questions de réflexion. Question centrale : ${$('question').value||'Aucune question centrale précisée'}. Données : ${JSON.stringify(chosen)}`;controller=new AbortController();$('status').textContent='Gemini compare '+systems.length+' systèmes…';$('output').textContent='';try{let r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.7,maxOutputTokens:12000}}),signal:controller.signal});let j=await r.json();if(!r.ok)throw Error(j.error?.message||'Erreur Gemini');let t=j.candidates?.[0]?.content?.parts?.map(x=>x.text||'').join('\n')||'Réponse vide';$('output').textContent=t;$('status').textContent='Analyse terminée.'}catch(e){$('status').textContent=e.name==='AbortError'?'Analyse interrompue.':e.message}}$('refresh').onclick=load;$('run').onclick=run;$('cancel').onclick=()=>controller?.abort();$('speak').onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('output').textContent);u.lang='fr-FR';speechSynthesis.speak(u)};$('pause').onclick=()=>speechSynthesis.paused?speechSynthesis.resume():speechSynthesis.pause();$('stop').onclick=()=>speechSynthesis.cancel();load();</script></body></html>
