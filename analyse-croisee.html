<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analyse croisée IA</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#35213f,#17111f 55%,#0d0b12);color:#f8f0dc;font-family:Georgia,serif}.wrap{max-width:900px;margin:auto;padding:22px 16px 50px}.panel{background:#21182b;border:1px solid #8b704866;border-radius:16px;padding:18px;margin:14px 0}.gold{color:#f2dfaa}button,select,input,textarea{font:inherit;border-radius:9px;padding:11px;border:1px solid #8b7048;background:#17111f;color:#fff;max-width:100%}button{background:#d7b76b;color:#17111f;font-weight:bold;cursor:pointer;margin:5px}textarea{width:100%;min-height:85px}a{color:#f2dfaa}.muted{color:#c2b5ca;font:14px/1.6 Arial}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.card{background:#30233b;border:1px solid #a88b5c;border-radius:12px;padding:13px;text-align:center;min-height:105px}.out{white-space:pre-wrap;line-height:1.7;font:15px/1.7 Arial;color:#f7edda}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.status{color:#d7b76b;font:13px Arial}.home{display:inline-block;margin-bottom:15px}</style></head><body><main class="wrap"><a class="home" href="index.html">← Retour aux six oracles</a><h1 class="gold">Analyse croisée des systèmes</h1><p class="muted">Sélectionne des tirages enregistrés dans l’historique commun. Gemini recherchera convergences, nuances et contradictions sans confondre les traditions.</p><section class="panel"><label>Question centrale (facultatif)</label><textarea id="question" placeholder="Quelle question veux-tu éclairer à travers plusieurs systèmes ?"></textarea><div id="entries"></div><div class="row"><button id="refresh">Actualiser l’historique</button><button id="run">Lancer l’analyse croisée</button><button id="cancel">Interrompre</button></div><div id="status" class="status"></div></section><section class="panel"><h2 class="gold">Synthèse comparative IA</h2><div id="output" class="out"></div><div class="row"><button id="speak">🔊 Lire</button><button id="pause">Pause / Reprise</button><button id="stop">Arrêter</button></div></section></main><script>const STORE='oraclesSuiteHistoryV2',KEY='oraclesSuiteGeminiApiKeyV1';const $=id=>document.getElementById(id);let selected=[],controller=null;function load(){let a=[];try{a=JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){}$('entries').innerHTML='';if(!a.length){$('entries').textContent='Aucun tirage trouvé. Effectue d’abord des tirages dans les oracles puis reviens ici.';return}a.forEach((x,i)=>{let l=document.createElement('label');l.style.cssText='display:block;padding:10px;border-bottom:1px solid #55435f;font:14px Arial';let c=document.createElement('input');c.type='checkbox';c.value=i;c.style.marginRight='9px';c.onchange=()=>{selected=c.checked?[...selected,i]:selected.filter(n=>n!==i)};l.append(c,document.createTextNode((x.game||'Oracle')+' · '+(x.date||'')+' · '+(x.question||'Tirage général')+' · '+(x.interpretation?'IA disponible':'sans interprétation IA')));$('entries').append(l)});window.__crossHistory=a}async function run(){let a=window.__crossHistory||[];let chosen=selected.map(i=>a[i]).filter(Boolean);if(chosen.length<2){$('status').textContent='Sélectionne au moins deux tirages de systèmes différents.';return}let systems=[...new Set(chosen.map(x=>x.game))];if(systems.length<2){$('status').textContent='Choisis au moins deux systèmes différents.';return}let key=localStorage.getItem(KEY)||'';if(!key){$('status').textContent='Ajoute ta clé Gemini sur la page d’accueil.';return}let prompt=`Tu es un analyste comparatif des traditions symboliques. Analyse ces tirages provenant de systèmes différents. Respecte la logique propre de chaque système, ne fusionne pas leurs significations et n’invente aucune donnée. Distingue convergences réelles, complémentarités, contradictions, éléments absents et hypothèses. Ne transforme pas une lecture symbolique en prédiction certaine. Structure : contexte commun; lecture de chaque système séparément; convergences; divergences/contradictions; ce que chaque système apporte de spécifique; synthèse intégrée; conseils concrets et questions de réflexion. Question centrale : ${$('question').value||'Aucune question centrale précisée'}. Données : ${JSON.stringify(chosen)}`;controller=new AbortController();$('status').textContent='Gemini compare '+systems.length+' systèmes…';$('output').textContent='';try{let r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.7,maxOutputTokens:12000}}),signal:controller.signal});let j=await r.json();if(!r.ok)throw Error(j.error?.message||'Erreur Gemini');let t=j.candidates?.[0]?.content?.parts?.map(x=>x.text||'').join('\n')||'Réponse vide';$('output').textContent=t;$('status').textContent='Analyse terminée.'}catch(e){$('status').textContent=e.name==='AbortError'?'Analyse interrompue.':e.message}}$('refresh').onclick=load;$('run').onclick=run;$('cancel').onclick=()=>controller?.abort();$('speak').onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('output').textContent);u.lang='fr-FR';speakOracleText(u.text)};$('pause').onclick=()=>speechSynthesis.paused?speechSynthesis.resume():speechSynthesis.pause();$('stop').onclick=()=>speechSynthesis.cancel();load();</script><script>
(()=>{
 const page=location.pathname.split('/').pop()||'oracle';
 const store='oraclesGeminiModelByOracleV1';
 const catalog=[
  ['gemini-3.8-flash','Gemini 3.8 Flash — recommandé'],['gemini-3.7-flash','Gemini 3.7 Flash'],['gemini-3.6-flash','Gemini 3.6 Flash'],['gemini-3.5-flash','Gemini 3.5 Flash'],['gemini-3.5-flash-lite','Gemini 3.5 Flash-Lite — économique'],['gemini-3.1-flash-lite','Gemini 3.1 Flash-Lite'],['gemini-3.1-pro-preview','Gemini 3.1 Pro — aperçu'],['gemini-3-flash-preview','Gemini 3 Flash — aperçu'],['gemini-2.5-pro','Gemini 2.5 Pro — accès restreint'],['gemini-2.5-flash','Gemini 2.5 Flash — accès restreint'],['gemini-2.5-flash-lite','Gemini 2.5 Flash-Lite — accès restreint']
 ];
 const getKey=()=>localStorage.getItem('oraclesSuiteGeminiApiKeyV1')||localStorage.getItem('geminiApiKey')||'';
 let choices={};try{choices=JSON.parse(localStorage.getItem(store)||'{}')}catch(e){}
 let selected=choices[page]||'gemini-3.8-flash';
 const box=document.createElement('section');box.id='oracleGeminiModelPanel';box.style.cssText='margin:12px 0;padding:12px;border:1px solid #b99a62;border-radius:12px;background:rgba(25,20,34,.94);color:#f7efd9;font:14px system-ui';
 const title=document.createElement('label');title.textContent='⚙ Modèle Gemini pour cet oracle';title.style.cssText='display:block;font-weight:700;margin-bottom:7px';
 const select=document.createElement('select');select.id='oracleGeminiModelChoice';select.style.cssText='width:100%;padding:10px;border-radius:8px;background:#17283b;color:#fff;border:1px solid #8b7048';
 const status=document.createElement('div');status.style.cssText='font-size:12px;opacity:.85;margin-top:7px';status.textContent='Choix enregistré séparément pour cet oracle. Modèles listés à titre indicatif : disponibilité selon la clé et le compte Google.';
 const refresh=document.createElement('button');refresh.type='button';refresh.textContent='Actualiser la liste depuis Google';refresh.style.cssText='margin-top:8px;padding:8px 10px;border-radius:8px;border:1px solid #b99a62;background:transparent;color:inherit';
 const fill=(arr)=>{select.innerHTML='';arr.forEach(([id,label])=>{let o=document.createElement('option');o.value=id;o.textContent=label;select.append(o)});if(!arr.some(x=>x[0]===selected))selected=arr[0]?.[0]||'gemini-3.8-flash';select.value=selected;};fill(catalog);
 select.addEventListener('change',()=>{selected=select.value;choices[page]=selected;localStorage.setItem(store,JSON.stringify(choices));status.textContent='Modèle choisi : '+selected+'. Il sera utilisé pour les prochaines analyses de cet oracle.';});
 refresh.addEventListener('click',async()=>{const key=getKey();if(!key){status.textContent='Enregistre d’abord ta clé Gemini sur la page d’accueil.';return;}refresh.disabled=true;status.textContent='Récupération des modèles accessibles à ta clé…';try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?key='+encodeURIComponent(key));const d=await r.json();if(!r.ok)throw Error(d.error?.message||('HTTP '+r.status));const found=(d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>{const id=(m.name||'').replace(/^models\//,'');return [id,(m.displayName||id)+(m.description?' — '+m.description.slice(0,65):'')]}).filter(x=>/^gemini-/.test(x[0]));if(!found.length)throw Error('Google n’a renvoyé aucun modèle compatible generateContent.');const unique=[...new Map(found.map(x=>[x[0],x])).values()].sort((a,b)=>a[0].localeCompare(b[0]));fill(unique);status.textContent=unique.length+' modèles Gemini compatibles trouvés pour cette clé. Le choix reste propre à cet oracle.';}catch(e){status.textContent='Impossible d’actualiser : '+e.message+' — la liste intégrée reste disponible.';}finally{refresh.disabled=false;}});
 box.append(title,select,refresh,status);
 const target=document.querySelector('main')||document.querySelector('.container')||document.body;
 target.insertBefore(box,target.firstChild);
 // Existing legacy dropdowns remain synchronized for scripts that read #aiModel.
 const legacy=document.getElementById('aiModel');if(legacy){legacy.value=selected;legacy.addEventListener('change',()=>{select.value=legacy.value;selected=legacy.value;choices[page]=selected;localStorage.setItem(store,JSON.stringify(choices));});select.addEventListener('change',()=>{if([...legacy.options].some(o=>o.value===selected))legacy.value=selected;});}
 // Route every generateContent request through this oracle's selected model.
 const nativeFetch=window.fetch.bind(window);
 window.fetch=(input,init)=>{let url=typeof input==='string'?input:(input&&input.url)||'';if(url.includes('/models/')&&url.includes(':generateContent')){const u=new URL(url,location.href);const m=u.pathname.match(/\/models\/([^/:]+):generateContent/);if(m){u.pathname=u.pathname.replace('/models/'+m[1]+':generateContent','/models/'+encodeURIComponent(selected)+':generateContent');input=typeof input==='string'?u.toString():new Request(u.toString(),input);}}return nativeFetch(input,init);};
 // Android Chrome can stall on long speech utterances: split at sentence boundaries.
 window.speakOracleText=(text)=>{if(!('speechSynthesis'in window)){alert('La lecture vocale n’est pas disponible dans ce navigateur.');return;}const synth=window.speechSynthesis;synth.cancel();const clean=String(text||'').replace(/```[\s\S]*?```/g,' ').replace(/[#*_`]/g,' ').replace(/\s+/g,' ').trim();if(!clean)return;const chunks=[];let rest=clean;while(rest.length>0){if(rest.length<=180){chunks.push(rest);break;}let cut=Math.max(rest.lastIndexOf('. ',180),rest.lastIndexOf('! ',180),rest.lastIndexOf('? ',180),rest.lastIndexOf('; ',180),rest.lastIndexOf(', ',180),rest.lastIndexOf(' ',180));if(cut<70)cut=180;chunks.push(rest.slice(0,cut+1).trim());rest=rest.slice(cut+1).trim();}let i=0;const next=()=>{if(i>=chunks.length)return;const u=new SpeechSynthesisUtterance(chunks[i++]);u.lang='fr-FR';u.rate=.94;u.onend=()=>{if(i<chunks.length)next()};u.onerror=(e)=>{if(e.error!=='canceled'&&i<chunks.length)setTimeout(next,150)};synth.speak(u)};setTimeout(next,120);};
})();
</script>
</body></html>
