name: Build and deploy Sanctuaire V17.3
on:
  push:
    branches: [V17.3]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: V17.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Verify production entry point
        run: |
          test -s dist/index.html
          grep -Eq 'src="/Mes-4-oracles/assets/[^"]+\.js"' dist/index.html
          find dist/assets -maxdepth 1 -type f -name '*.js' -size +0c | grep -q .
          echo "Production HTML and JavaScript bundles are present."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
