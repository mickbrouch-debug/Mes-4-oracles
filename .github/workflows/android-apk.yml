name: Build Android APK — Le Sanctuaire

on:
  workflow_dispatch:
  push:
    branches: [V17.3]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V17.3
        uses: actions/checkout@v4
        with:
          ref: V17.3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build bundled web application
        run: npm run build
        env:
          CAPACITOR_BUILD: '1'
          VITE_BUILD_VERSION: V17.3-android
          VITE_BUILD_COMMIT: ${{ github.sha }}
          VITE_BUILD_RUN: ${{ github.run_number }}

      - name: Generate Android project
        run: npx cap add android

      - name: Synchronize bundled application
        run: npx cap sync android

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Le-Sanctuaire-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
