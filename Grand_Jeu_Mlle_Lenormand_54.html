<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b1b"><title>Grand Lenormand — 54 cartes illustrées</title>
<style>
:root{--gold:#e8c982;--text:#f5efdf;--muted:#c8bfd4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#27365a 0,#111025 48%,#080914 100%);color:var(--text);font-family:Georgia,serif}main{max-width:1180px;margin:auto;padding:16px}header{text-align:center;padding:28px 12px;border:1px solid #8d7547;border-radius:22px;background:linear-gradient(135deg,#1c2546,#111025);margin:12px 0 20px}h1{color:var(--gold);font-size:clamp(28px,5vw,46px);font-weight:400;margin:0 0 10px}p{color:var(--muted);line-height:1.6}.panel{background:#17172dcc;border:1px solid #8d754755;border-radius:18px;padding:16px;margin:14px 0}button{border:1px solid var(--gold);border-radius:12px;padding:11px 16px;background:linear-gradient(135deg,#92774a,#e8c982);color:#151323;font-weight:bold;margin:4px;cursor:pointer}.secondary{background:#29243d;color:var(--text)}button:disabled{opacity:.4}.deck,.drawn{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.card{background:#111327;border:1px solid var(--gold);border-radius:12px;padding:5px;min-width:0}.card img{display:block;width:100%;aspect-ratio:11/15;object-fit:cover;border-radius:8px}.card strong{display:block;text-align:center;color:var(--gold);font-size:13px;padding:6px 2px}.card.selected{outline:2px solid #d6c28a}#result{display:none}.help{font:13px/1.5 Arial,sans-serif;color:var(--muted)}@media(max-width:760px){.deck,.drawn{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}}@media(max-width:420px){.deck,.drawn{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:10px}}
</style></head><body><main>
<header><div style="color:#e8c982;font-size:24px">✧ LE SANCTUAIRE DES ORACLES ✧</div><h1>Le Grand Lenormand</h1><p>54 illustrations — sélection manuelle et révélation</p></header>
<section class="panel"><h2>Préparer le tirage</h2><label>Nombre de cartes : <select id="count"><option>1</option><option>3</option><option>5</option><option>7</option><option selected>9</option><option>10</option><option>12</option><option>15</option><option>18</option><option>27</option><option>36</option><option>54</option></select></label><div><button id="shuffle">Mélanger les cartes</button><button id="clear" class="secondary">Effacer la sélection</button><button id="reveal" disabled>Révéler le tirage</button></div><p class="help" id="status">Sélectionne manuellement les cartes. Les JPEG doivent être dans assets/lenormand-grand-NN.jpg.</p></section>
<section class="panel"><h2>Choisir les cartes</h2><div id="deck" class="deck"></div></section><section class="panel" id="result"><h2>Révélation</h2><div id="drawn" class="drawn"></div></section></main>
<script>
const names=["Cavalier","Trèfle","Navire","Maison","Arbre","Nuages","Serpent","Cercueil","Bouquet","Faux","Fouet","Oiseaux","Enfant","Renard","Ours","Étoiles","Cigogne","Chien","Tour","Jardin","Montagne","Chemins","Souris","Cœur","Anneau","Livre","Lettre","Monsieur","Dame","Lys","Soleil","Lune","Clé","Poissons","Ancre","Croix","Pics","Pont","Puits","Fontaine","Désert","Boussole","Labyrinthe","Masque","Miroir","Perle","Château","Couronne","Épée","Scorpion","Temps","Sceau","Consultante","Consultant"];
const CARDS=names.map((name,i)=>({number:i+1,name,image:"assets/lenormand-grand-"+String(i+1).padStart(2,"0")+".jpg"}));
let order=[...CARDS],selected=[];const $=id=>document.getElementById(id);
function status(){$("status").textContent=selected.length+" / "+$("count").value+" cartes sélectionnées";$("reveal").disabled=selected.length!==+$("count").value}
function render(){const root=$("deck");root.replaceChildren();order.forEach(c=>{const b=document.createElement("button");b.className="card"+(selected.includes(c.number)?" selected":"");b.type="button";b.innerHTML='<img src="'+c.image+'" alt="'+c.name+'"><strong>'+String(c.number).padStart(2,"0")+" · "+c.name+"</strong>";b.onclick=()=>{if(selected.includes(c.number))selected=selected.filter(n=>n!==c.number);else if(selected.length<+$("count").value)selected.push(c.number);status();render()};root.appendChild(b)});status()}
function reveal(){const root=$("drawn");root.replaceChildren();selected.map(n=>CARDS.find(c=>c.number===n)).forEach(c=>{const d=document.createElement("div");d.className="card";d.innerHTML='<img src="'+c.image+'" alt="'+c.name+'"><strong>'+String(c.number).padStart(2,"0")+" · "+c.name+"</strong>";root.appendChild(d)});$("result").style.display="block";$("result").scrollIntoView({behavior:"smooth"})}
$("count").onchange=()=>{selected=[];render()};$("shuffle").onclick=()=>{order=[...CARDS].sort(()=>Math.random()-.5);selected=[];render()};$("clear").onclick=()=>{selected=[];$("result").style.display="none";render()};$("reveal").onclick=reveal;render();
</script></body></html>
