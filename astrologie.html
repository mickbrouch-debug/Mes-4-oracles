<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17111f"><link rel="manifest" href="manifest.webmanifest"><title>Oracle astrologique</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#35213f,#17111f 55%,#0d0b12);color:#f8f0dc;font-family:Georgia,serif}.wrap{max-width:900px;margin:auto;padding:22px 16px 50px}.panel{background:#21182b;border:1px solid #8b704866;border-radius:16px;padding:18px;margin:14px 0}.gold{color:#f2dfaa}button,select,input,textarea{font:inherit;border-radius:9px;padding:11px;border:1px solid #8b7048;background:#17111f;color:#fff;max-width:100%}button{background:#d7b76b;color:#17111f;font-weight:bold;cursor:pointer;margin:5px}textarea{width:100%;min-height:85px}a{color:#f2dfaa}.muted{color:#c2b5ca;font:14px/1.6 Arial}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.card{background:#30233b;border:1px solid #a88b5c;border-radius:12px;padding:13px;text-align:center;min-height:105px}.out{white-space:pre-wrap;line-height:1.7;font:15px/1.7 Arial;color:#f7edda}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.status{color:#d7b76b;font:13px Arial}.home{display:inline-block;margin-bottom:15px}</style></head><body><main class="wrap"><a class="home" href="index.html">← Retour aux six oracles</a><h1 class="gold">Oracle astrologique</h1><p class="muted">Signes, planètes et maisons astrologiques. Tirage symbolique à visée réflexive, pas une prédiction certaine.</p><section class="panel"><label>Ta question</label><textarea id="question" placeholder="Dicte ou écris ta question…"></textarea><button id="mic">🎙️ Dicter</button><span id="voiceStatus" class="status"></span><p><label>Nombre de symboles</label> <select id="count"><option>1</option><option selected>3</option><option>5</option><option>7</option></select></p><button id="draw">Effectuer le tirage</button><div id="drawn" class="cards"></div></section><section class="panel"><h2 class="gold">Interprétation Gemini</h2><button id="analyze">Analyser le tirage</button><button id="cancel">Interrompre</button><div id="status" class="status"></div><div id="output" class="out"></div><div class="row"><button id="speak">🔊 Lire</button><button id="pause">Pause / Reprise</button><button id="stop">Arrêter la voix</button></div></section><section class="panel"><h2 class="gold">Historique partagé</h2><div id="history" class="muted"></div></section></main><script>
const DECK=[{"name": "Bélier", "meaning": "initiative, courage, impulsion"}, {"name": "Taureau", "meaning": "stabilité, ressources, sensualité"}, {"name": "Gémeaux", "meaning": "échanges, curiosité, dualité"}, {"name": "Cancer", "meaning": "protection, mémoire, intimité"}, {"name": "Lion", "meaning": "créativité, rayonnement, affirmation"}, {"name": "Vierge", "meaning": "discernement, méthode, amélioration"}, {"name": "Balance", "meaning": "équilibre, relation, choix"}, {"name": "Scorpion", "meaning": "transformation, intensité, vérité"}, {"name": "Sagittaire", "meaning": "expansion, quête, confiance"}, {"name": "Capricorne", "meaning": "structure, ambition, responsabilité"}, {"name": "Verseau", "meaning": "liberté, innovation, collectif"}, {"name": "Poissons", "meaning": "intuition, compassion, imaginaire"}, {"name": "Soleil", "meaning": "identité, vitalité, conscience"}, {"name": "Lune", "meaning": "émotions, besoins, sécurité"}, {"name": "Mercure", "meaning": "pensée, parole, apprentissage"}, {"name": "Vénus", "meaning": "affection, valeurs, harmonie"}, {"name": "Mars", "meaning": "action, désir, affirmation"}, {"name": "Jupiter", "meaning": "croissance, confiance, opportunité"}, {"name": "Saturne", "meaning": "limites, patience, construction"}, {"name": "Uranus", "meaning": "rupture, indépendance, nouveauté"}, {"name": "Neptune", "meaning": "inspiration, idéal, flou"}, {"name": "Pluton", "meaning": "mutation, pouvoir, régénération"}, {"name": "Maison 1", "meaning": "identité et commencement"}, {"name": "Maison 2", "meaning": "ressources et valeurs"}, {"name": "Maison 3", "meaning": "communication et entourage"}, {"name": "Maison 4", "meaning": "foyer et racines"}, {"name": "Maison 5", "meaning": "créativité et plaisir"}, {"name": "Maison 6", "meaning": "quotidien et service"}, {"name": "Maison 7", "meaning": "partenariats et contrats"}, {"name": "Maison 8", "meaning": "transformation et partage"}, {"name": "Maison 9", "meaning": "voyages et convictions"}, {"name": "Maison 10", "meaning": "carrière et vocation"}, {"name": "Maison 11", "meaning": "amis et projets collectifs"}, {"name": "Maison 12", "meaning": "retrait et monde intérieur"}];const STORE='oraclesSuiteHistoryV2',KEY='oraclesSuiteGeminiApiKeyV1';let pulled=[],controller=null;const $=id=>document.getElementById(id);function pick(){pulled=[];let pool=[...DECK];for(let i=0;i<Math.min(+$('count').value,pool.length);i++){let n=Math.floor(Math.random()*pool.length);pulled.push(pool.splice(n,1)[0]);}$('drawn').innerHTML='';pulled.forEach((c,i)=>{let d=document.createElement('div');d.className='card';d.innerHTML='<div style="font-size:28px;color:#d7b76b">'+(c.symbol||'✧')+'</div><b>'+c.name+'</b><p class="muted">'+c.meaning+'</p><small>'+(i===0?'Situation':i===1?'Évolution':'Conseil')+'</small>'; $('drawn').append(d);});save('Tirage effectué');}function history(){let a=[];try{a=JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){}$('history').innerHTML='';a.filter(x=>x.game===document.title).slice(0,8).forEach(x=>{let d=document.createElement('details');let s=document.createElement('summary');s.textContent=(x.date||'')+' — '+(x.question||'Tirage général');let p=document.createElement('p');p.textContent=(x.cards||'')+'\n'+(x.interpretation||'');d.append(s,p);$('history').append(d);});}function save(interpretation){if(!pulled.length)return;let a=[];try{a=JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){}let q=$('question').value.trim()||'Tirage général';let sig=document.title+'|'+q+'|'+pulled.map(x=>x.name).join(',');let item=a.find(x=>x.signature===sig);if(!item){item={id:Date.now(),signature:sig,game:document.title,date:new Date().toLocaleString('fr-FR'),question:q,summary:'',cards:pulled.map((x,i)=>(i+1)+'. '+x.name+' — '+x.meaning).join('\n'),interpretation:''};a.unshift(item)}if(interpretation&&interpretation!=='Tirage effectué')item.interpretation=interpretation;localStorage.setItem(STORE,JSON.stringify(a.slice(0,150)));history();}$('draw').onclick=pick;$('analyze').onclick=async()=>{if(!pulled.length)pick();let key=localStorage.getItem(KEY)||'';if(!key){$('status').textContent='Ajoute d’abord ta clé Gemini sur la page d’accueil.';return;}controller=new AbortController();$('status').textContent='Analyse en cours…';$('output').textContent='';let prompt=`Tu es un interprète expert de Oracle astrologique. Analyse en français, avec nuance et profondeur. Réponds à la question sans présenter le symbolisme comme une certitude. Explique chaque symbole dans sa position, les liens entre eux, les tensions, les scénarios possibles, les conseils concrets et une synthèse. Question : ${$('question').value||'Tirage général'}. Tirage : ${JSON.stringify(pulled)}`;try{let r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.75,maxOutputTokens:8192}}),signal:controller.signal});let j=await r.json();if(!r.ok)throw Error(j.error?.message||'Erreur Gemini');let t=j.candidates?.[0]?.content?.parts?.map(x=>x.text||'').join('\n')||'Réponse vide';$('output').textContent=t;save(t);$('status').textContent='Interprétation enregistrée dans l’historique.'}catch(e){$('status').textContent=e.name==='AbortError'?'Analyse interrompue.':e.message}};$('cancel').onclick=()=>controller?.abort();$('speak').onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('output').textContent);u.lang='fr-FR';speechSynthesis.speak(u)};$('pause').onclick=()=>speechSynthesis.paused?speechSynthesis.resume():speechSynthesis.pause();$('stop').onclick=()=>speechSynthesis.cancel();const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(R)$('mic').onclick=()=>{let r=new R();r.lang='fr-FR';r.onresult=e=>$('question').value=e.results[0][0].transcript;r.start();$('voiceStatus').textContent='Je t’écoute…'};else $('mic').disabled=true;history();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
